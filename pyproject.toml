[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eqmetad"
version = "0.1.0"
description = "Adiabatic metadynamics in the instantaneous-equilibrium limit"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "numba>=0.59.0",
    "h5py>=3.10.0"
]

[project.scripts]
metad_gentraj = "eqmetad.gentraj:main"
metad_readhills = "eqmetad.readhills:main"
metad_target_distr = "eqmetad.analyze_target_distribution:main"
metad_config = "eqmetad.config_manager:create_default_config"

